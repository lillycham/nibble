[project]
name = "lighthouse"
version = "2.3.1"
description = "A small uptime watcher"
requires-python = ">=3.11"
license = { text = "ISC" }
dependencies = [
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.scripts]
lighthouse = "lighthouse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
