[package]
name = "nibble"
version = "0.1.0"
edition = "2021"
description = "A small local-model harness for tasks that don't need a big agent"
license = "MIT"

[dependencies]
serde_json = "1"
# The server is always on localhost, so leave out TLS and compression.
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = true
strip = true
