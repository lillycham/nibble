[package]
name = "nibble-gui"
version = "0.1.0"
edition = "2024"
description = "A native chat window for nibble"
# MIT, except src/input.rs, which is adapted from Apache-2.0 code.
license = "MIT AND Apache-2.0"

# Its own project, not a workspace member, so the CLI keeps its two
# dependencies and its small lock file.
[workspace]

[dependencies]
# runtime_shaders: compile the Metal shaders when the app starts, because the
# Nix sandbox has no Metal compiler to do it at build time.
gpui = { version = "0.2", features = ["runtime_shaders"] }
# These two are in GPUI's own tree already, so they add nothing to the build.
futures = "0.3"
unicode-segmentation = "1"
serde_json = "1"
# nibble serve speaks plain HTTP, so leave out TLS and compression.
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = true
strip = true
